<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Reporte Electro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1830; --card:#141f3a; --card2:#1a2848;
    --line:#26365e; --text:#e8edf7; --muted:#9fb0d0; --muted2:#6b7ba0;
    --brand:#3b82f6; --brand2:#60a5fa; --accent:#22c55e;
    --green:#16a34a; --greenbg:#0f2e1c; --amber:#d9a406; --amberbg:#332a05; --red:#dc2626; --redbg:#3a1113;
    --greenc:#c9f2d6; --amberc:#f6e6a8; --redc:#f6c3c3;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0a1020,#0b1220 40%,#0a0f1c);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(76px + var(--safe-b));
  }
  a{color:var(--brand2)}
  button{font-family:inherit}
  .app{max-width:760px;margin:0 auto;padding:16px 16px 0}
  .hidden{display:none!important}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:12px 16px;background:rgba(11,18,32,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:
    conic-gradient(from 210deg,#3b82f6,#22c55e,#3b82f6);display:grid;place-items:center;
    color:#031;font-weight:900;box-shadow:var(--shadow)}
  .brand small{display:block;color:var(--muted2);font-weight:600;font-size:11px;letter-spacing:.5px}
  .spacer{flex:1}
  .pill{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
  .dot.online{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer}

  /* Cards */
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:18px}
  .card h3{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}

  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input,select,textarea{width:100%;background:#0c1526;border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:16px;outline:none;transition:border .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--brand);color:white;border:none;padding:13px 16px;border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:transform .05s,filter .15s}
  .btn:active{transform:scale(.98)}
  .btn:hover{filter:brightness(1.07)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.green{background:var(--green)}
  .btn.danger{background:var(--red)}
  .btn.sm{width:auto;padding:9px 12px;font-size:13px;border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:10px;margin-top:14px}

  .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
    background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.en{background:#132038;border-color:#274268;color:#8fc0ff}
  .chip.lb{background:#0f2a20;border-color:#1f5540;color:#7fe0b0}
  .chip.ok{background:var(--greenbg);border-color:#1f5a33;color:var(--greenc)}
  .chip.warn{background:var(--amberbg);border-color:#5a4a0a;color:var(--amberc)}
  .chip.bad{background:var(--redbg);border-color:#6a2226;color:var(--redc)}

  .muted{color:var(--muted)}
  .tiny{font-size:12px;color:var(--muted2)}
  .center{text-align:center}
  .hr{height:1px;background:var(--line);margin:16px 0;border:0}

  /* Bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(12,19,36,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + var(--safe-b));display:flex;justify-content:space-around}
  .nav button{background:none;border:none;color:var(--muted2);font-size:11px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;cursor:pointer;
    flex:1;border-radius:10px}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.active{color:var(--brand2)}
  .nav button.active .ic{transform:translateY(-1px)}

  /* Report table */
  .rep-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px;background:#0c1526}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#0e1830;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  tbody tr.area-row td{background:#111d38;font-weight:800;color:#cfe0ff}
  tbody tr.total td{background:#0e1c14;font-weight:800}
  tbody tr.asesor td:first-child{padding-left:22px;color:var(--muted)}

  /* Jefe report cards (screenshot view) */
  #shot{background:linear-gradient(180deg,#0d1730,#0a1020);border-radius:18px;padding:16px}
  .shot-head{text-align:center;padding:10px 8px 14px}
  .shot-head .t{font-size:20px;font-weight:900}
  .shot-head .d{color:var(--muted);font-size:13px;margin-top:2px;text-transform:capitalize}
  .jefe{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr .9fr;gap:1px;
    background:var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
  .jefe>div{background:#0f1a33;padding:12px 10px}
  .jefe .jn{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;
    background:#14213f;font-weight:800}
  .jefe .lbl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px}
  .jefe .val{font-size:15px;font-weight:800;margin-top:2px}
  @media(max-width:560px){
    .jefe{grid-template-columns:repeat(3,1fr)}
    .jefe>div{padding:10px 8px}
    .jefe>div:last-child{grid-column:2 / -1}
    .jefe .val{font-size:13px}
    .cumpl{font-size:18px}
    #shot{padding:10px}
  }
  .jefe.state-ok{box-shadow:inset 0 0 0 2px #1f7a44}
  .jefe.state-warn{box-shadow:inset 0 0 0 2px #7a5f10}
  .jefe.state-bad{box-shadow:inset 0 0 0 2px #7a2226}
  .cumpl{font-size:20px;font-weight:900}
  .cumpl.ok{color:#4ade80}.cumpl.warn{color:#fbbf24}.cumpl.bad{color:#f87171}
  .semaforo{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .semaforo.ok{background:#22c55e}.semaforo.warn{background:#eab308}.semaforo.bad{background:#ef4444}

  /* verify form / OCR */
  .field-flag{border-color:var(--amber)!important;background:#1f1a06!important}
  .badge-ai{font-size:10px;background:#2a1e4a;border:1px solid #4a3a7a;color:#c4b5fd;padding:2px 7px;border-radius:999px;margin-left:6px}
  .ocr-note{font-size:12px;color:var(--amberc);background:var(--amberbg);border:1px solid #5a4a0a;padding:8px 10px;border-radius:10px;margin-top:8px}

  /* toast + modal */
  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);
    background:#0d1a35;border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;
    box-shadow:var(--shadow);z-index:100;max-width:90%;text-align:center;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(3,7,15,.7);z-index:90;display:grid;place-items:center;padding:16px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .m-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal .m-body{padding:18px}

  .list-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;background:#0c1526}
  .list-item .li-main{flex:1;min-width:0}
  .list-item .li-main .t{font-weight:700}
  .list-item .li-main .s{font-size:12px;color:var(--muted)}
  .li-amt{font-weight:800;white-space:nowrap}

  .seg{display:flex;background:#0c1526;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:6px 0 2px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:9px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
  .seg button.active{background:var(--brand);color:white}

  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .kpi .k{background:#0c1526;border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .k .n{font-size:20px;font-weight:900}
  .kpi .k .l{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px}

  .cfg-lock{max-width:420px;margin:60px auto}
  .search-res{max-height:260px;overflow:auto;margin-top:8px}
  .prod-row{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#0c1526;cursor:pointer}
  .prod-row:hover{border-color:var(--brand)}
  .prod-row .pd{font-weight:700;font-size:13px}
  .prod-row .pm{font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="brand">
    <div class="logo">RE</div>
    <div>Reporte Electro<small id="tbStore">Costanera Electro</small></div>
  </div>

<div class="app" id="app"></div>

</nav>

const $ = (s,el=document)=>el.querySelector(s);

function fechaLarga(str){
  const [y,m,d]=str.split("-").map(Number);

}

/* ---------- Jerarquía: producto/subclase -> departamento/área/elegible ---------- */
function subclaseInfo(subclase){
  subclase=clean(subclase);
  const subl = subclase.slice(0,5);           // J1114...
  const base = HIER.SUBLINEA[subl];           // [descL, depto, area]
  if(!base) return null;
  let depto = base[1], area = base[2];
  if(HIER.SUBCLASE_OVR[subclase]) depto = HIER.SUBCLASE_OVR[subclase];
  const elegible = !!HIER.ELEGIBLES[subclase];
  return {subclase, subl, sublDesc:base[0], depto, area, elegible,
          desc: HIER.SUBCLASE_DESC[subclase]||""};
}
function buscarProductos(q){
  q=norm(q); if(q.length<2) return [];
  const out=[];
  for(const p of INV){
    const [num,upc,desc,sub]=p;
    if(norm(desc).includes(q)||num.includes(q)||upc.includes(q)){
      out.push({num,upc,desc,sub, info:subclaseInfo(sub)});
      if(out.length>=40) break;
    }
  }
  return out;
}

  lsSet(k,v){ localStorage.setItem(k,JSON.stringify(v)) },

    const c = this.lsGet("re_config",null);
    this.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), c||{});
    // asegurar sub-objetos
    this.config.gemini   = Object.assign({},DEFAULT_CONFIG.gemini,this.config.gemini||{});

  async saveConfig(cfg){
    this.config=cfg; this.lsSet("re_config",cfg);

      try{ await this.db.collection("config").doc("app").set(cfg,{merge:true}); }catch(e){ console.warn(e);}

  async init(){
    this.loadLocalConfig();

    try{

      if(doc.exists){ this.config=Object.assign(this.config,doc.data()); this.lsSet("re_config",this.config); }

      return new Promise(res=>{
        this.auth.onAuthStateChanged(async u=>{
          if(u){ const d=await this.db.collection("usuarios").doc(u.uid).get();
            this.user=d.exists?d.data():{uid:u.uid,display:u.email}; }
          else this.user=null;
          res(this.user);
        });
      });
    }else{
      const sid=this.lsGet("re_session",null);
      if(sid){ const users=this.lsGet("re_users",{});
        this.user=Object.values(users).find(u=>u.uid===sid)||null; }
      return this.user;
    }
  },
  async signOut(){
    if(this.mode==="firebase"){ await this.auth.signOut(); }
    else{ localStorage.removeItem("re_session"); }
    this.user=null;
  },

  /* -------- Ventas -------- */
  async addVenta(v){
    v.registradoPor=this.user.uid; v.registradoPorNombre=this.user.display||"";
    v.ts=Date.now();
    if(this.mode==="firebase"){
      const ref=await this.db.collection("ventas").add(v); v.id=ref.id;
    }else{
      v.id=uid(); const arr=this.lsGet("re_ventas",[]); arr.push(v); this.lsSet("re_ventas",arr);
      this._emit();
    }
    return v;
  },
  async updateVenta(id,patch){
    if(this.mode==="firebase"){ await this.db.collection("ventas").doc(id).update(patch); }
    else{ const arr=this.lsGet("re_ventas",[]); const i=arr.findIndex(x=>x.id===id);
      if(i>=0){arr[i]=Object.assign(arr[i],patch); this.lsSet("re_ventas",arr); this._emit();} }
  },
  async deleteVenta(id){
    if(this.mode==="firebase"){ await this.db.collection("ventas").doc(id).delete(); }
    else{ let arr=this.lsGet("re_ventas",[]); arr=arr.filter(x=>x.id!==id); this.lsSet("re_ventas",arr); this._emit(); }
  },
  subscribeVentas(cb){
    this.onVentas=cb;
    if(this.mode==="firebase"){
      this.db.collection("ventas").orderBy("ts","desc").onSnapshot(snap=>{
        this.ventasCache=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        cb(this.ventasCache);
      },err=>{console.warn(err);toast("Error leyendo ventas: revisa las reglas de Firestore");});
    }else{ this._emit(); }
  },
  _emit(){ this.ventasCache=this.lsGet("re_ventas",[]).sort((a,b)=>b.ts-a.ts);
    if(this.onVentas)this.onVentas(this.ventasCache); },

  /* -------- Avances importados (Looker) -------- */
  async addAvance(a){
    a.importadoPor=this.user.uid; a.importadoPorNombre=this.user.display||""; a.ts=Date.now();
    if(this.mode==="firebase"){ const ref=await this.db.collection("avances").add(a); a.id=ref.id; }
    else{ a.id=uid(); const arr=this.lsGet("re_avances",[]); arr.push(a); this.lsSet("re_avances",arr); this._emitAv(); }
    return a;
  },
  async deleteAvance(id){
    if(this.mode==="firebase"){ await this.db.collection("avances").doc(id).delete(); }
    else{ let arr=this.lsGet("re_avances",[]).filter(x=>x.id!==id); this.lsSet("re_avances",arr); this._emitAv(); }
  },
  subscribeAvances(cb){
    this.onAvances=cb;
    if(this.mode==="firebase"){
      this.db.collection("avances").orderBy("ts","desc").onSnapshot(snap=>{
        this.avancesCache=snap.docs.map(d=>Object.assign({id:d.id},d.data())); cb(this.avancesCache);
      },err=>console.warn(err));
    }else{ this._emitAv(); }
  },
  _emitAv(){ this.avancesCache=this.lsGet("re_avances",[]).sort((a,b)=>b.ts-a.ts); if(this.onAvances)this.onAvances(this.avancesCache); },

  async uploadBoleta(file){
    if(this.mode==="firebase" && this.storage){
      const path=`boletas/${this.user.uid}/${Date.now()}_${file.name||"boleta"}`;
      const ref=this.storage.ref().child(path);
      await ref.put(file); return await ref.getDownloadURL();
    }
    return null; // en local no subimos archivos
  }
};

   ========================================================================= */
async function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
}
async function extraerConGemini(file){
  const g=Store.config.gemini;
  if(!g.apiKey) throw new Error("Falta la API key de Gemini (configúrala en ⚙️ Config).");
  const b64=await fileToBase64(file);
  const prompt=`Eres un asistente que lee una BOLETA/COMPROBANTE de venta de una tienda de electrohogar en Chile.
Extrae SOLO lo que veas realmente. Devuelve EXCLUSIVAMENTE un JSON válido (sin texto extra) con estas llaves:
{
 "vendedor_nombre": string|null,
 "vendedor_codigo": string|null,
 "producto": string|null,
 "codigo_producto": string|null,
 "monto": number|null,            // monto/precio del producto o de la venta principal, en pesos, solo dígitos
 "valor_garantia": number|null,   // valor de la garantía extendida o seguro si aparece, en pesos, solo dígitos
 "tipo": string|null,             // uno de: "Garantía Extendida","Seguro Connect","No Mix","Attach","Canje de Puntos","Puntos + Pesos" o null
 "confianza": number,             // 0 a 1
 "dudas": [string]                // lista de campos poco claros que conviene revisar manualmente
}
Reglas: montos como número entero sin puntos ni símbolos. Si un dato no aparece o no es legible, usa null y agrégalo a "dudas".`;
  const model=g.model||"gemini-2.0-flash";
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(g.apiKey)}`;
  const body={ contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||"image/jpeg",data:b64}}]}],
    generationConfig:{temperature:0.1, response_mime_type:"application/json"} };
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("Gemini "+r.status+": "+t.slice(0,180)); }
  const j=await r.json();
  const txt=j?.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
  let data; try{ data=JSON.parse(txt); }catch{ const m=txt.match(/\{[\s\S]*\}/); data=m?JSON.parse(m[0]):{}; }
  return data;
}

/* Parseo de export de Looker (HTML/TXT/CSV) con Gemini -> filas normalizadas */
async function geminiTexto(prompt){
  const g=Store.config.gemini;
  if(!g.apiKey) throw new Error("Falta la API key de Gemini (⚙️ Config).");
  const model=g.model||"gemini-2.0-flash";
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(g.apiKey)}`;
  const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.1,response_mime_type:"application/json"}};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("Gemini "+r.status+": "+t.slice(0,180)); }
  const j=await r.json();
  const txt=j?.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
  try{ return JSON.parse(txt); }catch{ const m=txt.match(/\{[\s\S]*\}/); return m?JSON.parse(m[0]):{}; }
}
function htmlATexto(s){
  return s.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<script[\s\S]*?<\/script>/gi,"")
          .replace(/<\/(tr|div|p|table)>/gi,"\n").replace(/<\/td>|<\/th>/gi," | ")
          .replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&")
          .replace(/[ \t]+/g," ").replace(/\n{2,}/g,"\n").trim();
}
async function extraerAvancesLooker(text){
  const clip=text.slice(0,120000);
  const prompt=`Recibes el contenido de un reporte exportado desde Looker Studio (puede venir como texto/tabla) de una tienda de electrohogar en Chile.
Contiene AVANCES de venta por DEPARTAMENTO y/o por ASESOR (vendedor), para garantía extendida (GEXT) y/o seguro (Seguro Connect).
Devuelve EXCLUSIVAMENTE un JSON válido:
{
 "filas":[ { "nivel":"departamento"|"asesor", "nombre":string, "area":string|null,
             "departamento":string|null, "gext":number, "seguro":number, "otros":number } ],
 "periodo": string|null,
 "dudas":[string]
}
Reglas: montos como enteros en pesos (sin puntos ni símbolos); si no hay un valor usa 0.

Si una fila es un total general, NO la incluyas. Contenido:
"""${clip}"""`;
  return await geminiTexto(prompt);
}

async function procesarBoleta(file){
  const st=$("#ocrStatus");
  if(!Store.config.gemini.apiKey){
    st.innerHTML=`<div class="ocr-note">⚠️ Para leer la boleta automáticamente configura la API key de Gemini en ⚙️ Config. Por ahora ingresa los datos a mano.</div>`;
    // aún así subir la imagen si hay firebase
    try{ const url=await Store.uploadBoleta(file); if(url){draft.boletaUrl=url;toast("Boleta adjuntada");} }catch{}
    return;
  }
  st.innerHTML=`<div class="ocr-note">🤖 Leyendo la boleta con IA…</div>`;
  try{
    const [data,url]=await Promise.all([extraerConGemini(file), Store.uploadBoleta(file).catch(()=>null)]);
    if(url) draft.boletaUrl=url;
    abrirVerificacion(data,file);
    st.innerHTML="";
  }catch(err){
    st.innerHTML=`<div class="ocr-note">No pude leer la boleta (${esc(err.message||'')}). Ingresa los datos manualmente.</div>`;
  }
}

/* ---------------- REPORTE ---------------- */
let repDate=todayStr(); let repRange="dia"; let repSource="ventas"; // ventas | looker
const M0=()=>({gext:0,seguro:0,otros:0});
function estado(pct){ if(pct>=100)return"ok"; if(pct>=80)return"warn"; return"bad"; }
function colorPct(es){ return es==='ok'?'#4ade80':es==='warn'?'#fbbf24':'#f87171'; }
function diffDays(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function inferArea(depto){
  const dep=(depto||"").toUpperCase();
  for(const a of AREAS){ if((Store.config.departamentos[a]||[]).map(x=>x.toUpperCase()).includes(dep)) return a; }
  return dep.includes("BLANCA")?"LINEA BLANCA":"ELECTRO NEGRO";
}
function jefeDe(area,depto){
  const cand=Store.config.jefes.filter(j=>j.area===area);
  return cand.find(j=>(j.departamentos||[]).includes(depto)) || cand[0] || null;
}
function deptTotal(D){
  if(Object.keys(D.ases).length){ const t=M0(); Object.values(D.ases).forEach(x=>{t.gext+=x.gext;t.seguro+=x.seguro;t.otros+=x.otros;}); return t; }
  return D.dept||M0();
}
/* Ventas del periodo -> areaAgg */
function areaAggVentas(desde,hasta){
  const areaAgg={};
  Store.ventasCache.forEach(v=>{
    const f=v.fecha||""; if(f<desde||f>hasta) return;
    const cat=v.categoria||Store.config.tipoCat[v.tipo]||"OTROS"; const monto=+v.monto||0;
    const area=v.area||"(sin área)", depto=v.departamento||"(sin depto)", nm=v.asesorNombre||"(sin nombre)";
    const A=areaAgg[area]=areaAgg[area]||{depts:{}};
    const D=A.depts[depto]=A.depts[depto]||{ases:{},dept:null};
    const x=D.ases[nm]=D.ases[nm]||M0();
    if(cat==="GEXT")x.gext+=monto; else if(cat==="SEGURO")x.seguro+=monto; else x.otros+=monto;
  });
  return areaAgg;
}
/* Avance Looker (el más reciente con fecha <= hasta) -> areaAgg */
function avanceVigente(hasta){
  return Store.avancesCache.filter(a=>(a.fecha||"")<=hasta).sort((a,b)=>(a.fecha<b.fecha?1:-1)||(b.ts-a.ts))[0]||null;
}
function areaAggAvance(av){
  const areaAgg={};
  (av?.filas||[]).forEach(f=>{
    const depto=(f.departamento||(f.nivel==='departamento'?f.nombre:"(sin depto)"))||"(sin depto)";
    const area=f.area||inferArea(depto);
    const A=areaAgg[area]=areaAgg[area]||{depts:{}};
    const D=A.depts[depto]=A.depts[depto]||{ases:{},dept:null};
    const g=+f.gext||0,s=+f.seguro||0,o=+f.otros||0;
    if(f.nivel==='asesor'){ const nm=f.nombre||"(sin nombre)"; const x=D.ases[nm]=D.ases[nm]||M0(); x.gext+=g;x.seguro+=s;x.otros+=o; }
    else { D.dept=D.dept||M0(); D.dept.gext+=g;D.dept.seguro+=s;D.dept.otros+=o; }
  });
  return areaAgg;
}
/* jefeAgg + totales desde areaAgg */
function rollup(areaAgg){
  const jefeAgg={}; Store.config.jefes.forEach(j=>jefeAgg[j.id]=M0());
  let gextTot=0,segTot=0,otrosTot=0;
  for(const area of Object.keys(areaAgg)){
    for(const depto of Object.keys(areaAgg[area].depts)){
      const dt=deptTotal(areaAgg[area].depts[depto]);
      const j=jefeDe(area,depto);
      if(j){ jefeAgg[j.id].gext+=dt.gext; jefeAgg[j.id].seguro+=dt.seguro; jefeAgg[j.id].otros+=dt.otros; }
      gextTot+=dt.gext; segTot+=dt.seguro; otrosTot+=dt.otros;
    }
  }
  return {jefeAgg,gextTot,segTot,otrosTot};
}

function renderReporte(app){
  const cfg=Store.config;
  const ym=repDate.slice(0,7);
  const desde = repRange==="dia" ? repDate : ym+"-01";
  const hasta = repRange==="dia" ? repDate : ym+"-31";
  // fuente de datos
  let areaAgg, avUsado=null;
  if(repSource==="looker"){ avUsado=avanceVigente(hasta); areaAgg=areaAggAvance(avUsado); }
  else areaAgg=areaAggVentas(desde,hasta);
  const {jefeAgg,gextTot,segTot,otrosTot}=rollup(areaAgg);

  // ---- metas diarias (mes comercial) usan SIEMPRE el acumulado del mes ----
  const mes=cfg.mes||{};
  let metaInfo=null;
  if(mes.inicio&&mes.fin){
    // avance del mes segun la fuente
    let mesAgg;
    if(repSource==="looker"){ mesAgg=areaAggAvance(avanceVigente(mes.fin)); }
    else mesAgg=areaAggVentas(mes.inicio,mes.fin);
    const mesRoll=rollup(mesAgg);
    const diasTot=diffDays(mes.inicio,mes.fin)+1;
    const hoy=todayStr();
    const ref = hoy<mes.inicio?mes.inicio : (hoy>mes.fin?mes.fin:hoy);
    const diasRest=Math.max(1,diffDays(ref,mes.fin)+1);
    const diasTrans=diasTot-diasRest+1;
    metaInfo={diasTot,diasRest,diasTrans,mesRoll};

  // ---- resumen jefes (vista foto) ----

  if(metaInfo){

        </tbody></table></div>

  }else{

  }

      <div class="k"><div class="l">GExt total</div><div class="n">${CLP(gextTot)}</div></div>

let impFilas=[];
function modalImportarLooker(){
  impFilas=[];
  const html=`<div class="modal-bg" id="impBg"><div class="modal"><div class="m-head"><b>Importar avances de Looker</b><button class="icon-btn" id="impX">✕</button></div>
    <div class="m-body">

      <label class="btn secondary" style="cursor:pointer;margin-top:10px">📄 Elegir archivo (.html/.txt/.csv)
        <input id="impFile" type="file" accept=".html,.htm,.txt,.csv,text/html,text/plain" class="hidden"></label>
      <div id="impStatus"></div>
      <div id="impTabla"></div>
    </div></div></div>`;

  $("#impX").onclick=close;
  $("#impBg").onclick=e=>{if(e.target.id==="impBg")close();};
  $("#impFile").onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    const st=$("#impStatus");
    if(!Store.config.gemini.apiKey){ st.innerHTML=`<div class="ocr-note">⚠️ Configura la API key de Gemini en ⚙️ Config para leer el archivo.</div>`; return; }
    st.innerHTML=`<div class="ocr-note">🤖 Leyendo el archivo con IA…</div>`;
    try{
      let text=await file.text();
      if(/\.html?$/i.test(file.name)||/<html|<table|<td/i.test(text)) text=htmlATexto(text);
      const data=await extraerAvancesLooker(text);
      impFilas=(data.filas||[]).map(f=>({
        nivel:f.nivel==='departamento'?'departamento':'asesor',
        nombre:f.nombre||"", area:f.area||inferArea(f.departamento||f.nombre),
        departamento:f.departamento|| (f.nivel==='departamento'?f.nombre:""),
        gext:+f.gext||0, seguro:+f.seguro||0, otros:+f.otros||0
      }));
      st.innerHTML=`<div class="ocr-note">Detecté ${impFilas.length} fila(s). Revisa y corrige antes de guardar.${data.dudas&&data.dudas.length?' Dudas: '+data.dudas.map(esc).join(', '):''}</div>`;
      drawImpTabla();
    }catch(err){ st.innerHTML=`<div class="ocr-note">No pude leer el archivo (${esc(err.message||'')}).</div>`; }
  };
  function drawImpTabla(){
    if(!impFilas.length){ $("#impTabla").innerHTML=""; return; }
    $("#impTabla").innerHTML=`
      <div class="rep-wrap" style="margin-top:12px"><table><thead><tr><th>Nivel</th><th>Nombre</th><th>Área</th><th>Depto</th><th>GExt</th><th>Seguro</th><th></th></tr></thead>
      <tbody>${impFilas.map((f,i)=>`<tr>
        <td><select data-i="${i}" data-f="nivel"><option value="asesor" ${f.nivel==='asesor'?'selected':''}>asesor</option><option value="departamento" ${f.nivel==='departamento'?'selected':''}>depto</option></select></td>
        <td><input data-i="${i}" data-f="nombre" value="${esc(f.nombre)}" style="min-width:120px"></td>
        <td><select data-i="${i}" data-f="area">${AREAS.map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join("")}</select></td>
        <td><input data-i="${i}" data-f="departamento" value="${esc(f.departamento)}" style="min-width:100px"></td>
        <td><input data-i="${i}" data-f="gext" inputmode="numeric" value="${f.gext}" style="min-width:80px"></td>
        <td><input data-i="${i}" data-f="seguro" inputmode="numeric" value="${f.seguro}" style="min-width:80px"></td>
        <td><button class="icon-btn" data-del="${i}">🗑</button></td></tr>`).join("")}</tbody></table></div>
      <div class="btn-row"><button class="btn green" id="impSave">Guardar avance</button>
        <button class="btn ghost sm" id="impAdd">+ Fila</button></div>`;
    $$("#impTabla [data-i]").forEach(el=>el.onchange=()=>{
      const f=impFilas[+el.dataset.i],k=el.dataset.f;
      f[k]=(k==='gext'||k==='seguro')? (+String(el.value).replace(/[^\d]/g,"")||0) : el.value;
    });
    $$("#impTabla [data-del]").forEach(b=>b.onclick=()=>{impFilas.splice(+b.dataset.del,1);drawImpTabla();});
    $("#impAdd").onclick=()=>{impFilas.push({nivel:'asesor',nombre:'',area:AREAS[0],departamento:'',gext:0,seguro:0,otros:0});drawImpTabla();};
    $("#impSave").onclick=async()=>{
      const fecha=$("#impFecha").value||todayStr();

      catch(err){ toast("Error: "+(err.message||err)); btn.disabled=false; btn.textContent="Guardar avance"; }
    };
  }
}

    <div class="li-main">
      <div class="t">${esc(v.asesorNombre||'—')} ${chip}</div>
      <div class="s">${esc(v.area||'')} · ${esc(v.departamento||'')} · ${esc(v.fecha||'')}${v.producto?' · '+esc(v.producto):''}</div>
      <div class="s">Registró: ${esc(v.registradoPorNombre||'')}</div>
    </div>
    <div class="li-amt">${CLP(v.monto)}</div>
    ${mine?`<button class="icon-btn" data-del="${v.id}" title="Eliminar">🗑</button>`:''}
  </div>`;
}

/* ---------------- CONFIGURACIÓN ---------------- */
let cfgUnlocked=false;
function renderConfig(app){
  if(!cfgUnlocked){
    app.innerHTML=`<div class="card cfg-lock">
      <h2>Configuración</h2>
      <p class="sub">Ingresa la clave de administración.</p>
      <label>Clave</label><input id="cfgPass" type="password" placeholder="••••••••">
      <button class="btn" id="cfgUnlock" style="margin-top:14px">Entrar</button>
    </div>`;
    $("#cfgUnlock").onclick=()=>{
      if($("#cfgPass").value===CFG_PASS){cfgUnlocked=true;renderConfig(app);}
      else toast("Clave incorrecta");
    };
    $("#cfgPass").onkeydown=e=>{if(e.key==="Enter")$("#cfgUnlock").click();};
    return;
  }
  const c=Store.config;
  app.innerHTML=`
  <div class="card">
    <h2>Configuración</h2>
    <p class="sub">Estos ajustes se comparten con todo el equipo cuando Firebase está activo.</p>

    <h3>Tienda</h3>
    <input id="cTienda" value="${esc(c.tienda||'')}">

    <h3>Mes comercial (para metas diarias)</h3>
    <div class="grid2">
      <div><label>Inicio</label><input id="cMesIni" type="date" value="${esc(c.mes?.inicio||'')}"></div>
      <div><label>Término</label><input id="cMesFin" type="date" value="${esc(c.mes?.fin||'')}"></div>
    </div>
    <p class="tiny">La meta diaria se calcula como (plan − avance) ÷ días que faltan hasta el término.</p>

    <h3>Jefes y metas</h3>
    <div id="jefesBox"></div>
    <button class="btn ghost sm" id="addJefe" style="margin-top:8px">+ Agregar jefe</button>

    <h3>Extracción de boletas (IA · Gemini)</h3>
    <label>API key de Google Gemini</label>
    <input id="cGemKey" type="password" value="${esc(c.gemini.apiKey||'')}" placeholder="AIza…">
    <label>Modelo</label>
    <input id="cGemModel" value="${esc(c.gemini.model||'gemini-2.0-flash')}">
    <p class="tiny">Consíguela gratis en aistudio.google.com/apikey. Restríngela por dominio en Google Cloud.</p>

    <h3>Firebase (multiusuario en línea)</h3>
    <p class="tiny">Pega la config de tu proyecto (Configuración del proyecto → Tus apps → SDK). Al guardar, recarga la app.</p>
    <div class="grid2">
      <div><label>apiKey</label><input id="fbApiKey" value="${esc(c.firebase.apiKey||'')}"></div>
      <div><label>authDomain</label><input id="fbAuthDomain" value="${esc(c.firebase.authDomain||'')}"></div>
      <div><label>projectId</label><input id="fbProjectId" value="${esc(c.firebase.projectId||'')}"></div>
      <div><label>storageBucket</label><input id="fbStorage" value="${esc(c.firebase.storageBucket||'')}"></div>
      <div><label>messagingSenderId</label><input id="fbSender" value="${esc(c.firebase.messagingSenderId||'')}"></div>
      <div><label>appId</label><input id="fbAppId" value="${esc(c.firebase.appId||'')}"></div>
    </div>
    <label>…o pega el JSON completo aquí</label>
    <textarea id="fbJson" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…", …}'></textarea>

    <div class="btn-row">
      <button class="btn green" id="cfgSave">Guardar configuración</button>
      <button class="btn ghost sm" id="cfgLock">Bloquear</button>
    </div>
  </div>`;

  // jefes editor
  function drawJefes(){
    $("#jefesBox").innerHTML=c.jefes.map((j,i)=>`
      <div class="list-item" style="flex-wrap:wrap;gap:8px">
        <div style="flex:1 1 100%;display:flex;gap:8px;align-items:center">
          <input data-j="${i}" data-f="nombre" value="${esc(j.nombre)}" style="flex:1" placeholder="Nombre jefe">
          <select data-j="${i}" data-f="area" style="flex:1">${AREAS.map(a=>`<option ${j.area===a?'selected':''}>${a}</option>`).join("")}</select>
          <button class="icon-btn" data-delj="${i}">🗑</button>
        </div>
        <div style="flex:1 1 100%" class="grid2">
          <div><label>Plan GExt</label><input data-j="${i}" data-f="planGext" inputmode="numeric" value="${j.planGext||0}"></div>
          <div><label>Plan Seguro</label><input data-j="${i}" data-f="planSeguro" inputmode="numeric" value="${j.planSeguro||0}"></div>
        </div>
        <div style="flex:1 1 100%"><label>Departamentos (coma)</label>
          <input data-j="${i}" data-f="departamentos" value="${esc((j.departamentos||[]).join(', '))}"></div>
      </div>`).join("");
    $$("#jefesBox [data-delj]").forEach(b=>b.onclick=()=>{c.jefes.splice(+b.dataset.delj,1);drawJefes();});
  }
  drawJefes();
  $("#addJefe").onclick=()=>{c.jefes.push({id:uid(),nombre:"",area:"ELECTRO NEGRO",departamentos:[],planGext:0,planSeguro:0});drawJefes();};

  $("#cfgLock").onclick=()=>{cfgUnlocked=false;renderConfig(app);};
  $("#cfgSave").onclick=async()=>{
    c.tienda=$("#cTienda").value;
    c.mes={inicio:$("#cMesIni").value,fin:$("#cMesFin").value};
    $$("#jefesBox [data-j]").forEach(inp=>{
      const j=c.jefes[+inp.dataset.j],f=inp.dataset.f;
      if(f==="departamentos")j[f]=inp.value.split(",").map(s=>s.trim()).filter(Boolean);
      else if(f==="planGext"||f==="planSeguro")j[f]=+String(inp.value).replace(/[^\d]/g,"")||0;
      else j[f]=inp.value;
    });
    c.gemini.apiKey=$("#cGemKey").value.trim();
    c.gemini.model=$("#cGemModel").value.trim()||"gemini-2.0-flash";
    let fb={apiKey:$("#fbApiKey").value.trim(),authDomain:$("#fbAuthDomain").value.trim(),
      projectId:$("#fbProjectId").value.trim(),storageBucket:$("#fbStorage").value.trim(),
      messagingSenderId:$("#fbSender").value.trim(),appId:$("#fbAppId").value.trim()};
    const jsonTxt=$("#fbJson").value.trim();
    if(jsonTxt){ try{ const o=JSON.parse(jsonTxt); fb=Object.assign(fb,o); }catch{ toast("El JSON de Firebase no es válido"); return; } }
    c.firebase=fb;
    await Store.saveConfig(c);
    toast("Configuración guardada ✓");
    if(fb.apiKey&&fb.projectId&&Store.mode!=="firebase"){
      if(confirm("Firebase configurado. ¿Recargar para conectar en línea?")) location.reload();
    }
  };
}

/* =========================================================================
   Arranque
   ========================================================================= */
function updateModePill(){
  const on=Store.mode==="firebase";
  $("#modeText").textContent=on?"en línea":"local";
  $("#modeDot").classList.toggle("online",on);
  $("#tbStore").textContent=Store.config?.tienda||"Costanera Electro";
}
(async function(){
  await Store.init();
  updateModePill();
  await Store.restoreSession();
  Store.subscribeVentas(()=>{ if(CURRENT==="reporte")renderReporte($("#app"));
    if(CURRENT==="historial")renderHistorial($("#app")); });
  Store.subscribeAvances(()=>{ if(CURRENT==="reporte")renderReporte($("#app")); });
  render();
  // service worker (PWA) — opcional
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch{} }
})();
</script>
</body>
