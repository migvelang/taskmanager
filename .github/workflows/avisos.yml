name: Avisos de casos detenidos

on:
  schedule:
    # Cada hora dentro de la ventana que cubre las 09:00–21:59 de Chile en
    # verano (UTC-3) y en invierno (UTC-4). El horario exacto lo decide el
    # script mirando la hora real de Santiago, así que el cambio de hora no
    # lo desajusta: las corridas que caen fuera terminan sin enviar nada.
    - cron: '0 12-23,0-1 * * *'
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save web-push@3.6.7 google-auth-library@9.15.0
      - run: node scripts/enviar-avisos.js
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_CONTACTO: ${{ secrets.VAPID_CONTACTO }}
