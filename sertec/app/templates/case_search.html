{% extends "base.html" %}
{% block title %}Buscar caso · SERTEC{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-slate-900 mb-1">Buscar caso</h1>
  <p class="text-sm text-slate-500 mb-4">Busca por <b>N° OST</b>, <b>N° F11</b> o <b>N° de caso PU</b> (SS_NRO).</p>
  <form method="get" action="/caso" class="flex gap-2">
    <input name="q" value="{{ q or '' }}" autofocus placeholder="Ej: 50315, 1162463382, 67928504"
      class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-cyan-500 outline-none">
    <button class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold rounded-lg px-5">Buscar</button>
  </form>
  {% if no_result %}
    <div class="mt-4 text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
      No se encontró ninguna OST ni caso PU con «{{ q }}» en la última carga.
    </div>
  {% endif %}
</div>
{% endblock %}
