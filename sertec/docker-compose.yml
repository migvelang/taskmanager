services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sertec
      POSTGRES_PASSWORD: sertec
      POSTGRES_DB: sertec
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sertec"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sertec:sertec@db:5432/sertec
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sertec.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    ports:
      - "8000:8000"

volumes:
  pgdata:
